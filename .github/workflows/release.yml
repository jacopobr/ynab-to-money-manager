name: Create GitHub Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate repository
        run: npm run check
      - name: Package the website
        run: zip -r "ynab-to-money-manager-${GITHUB_REF_NAME}.zip" dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "ynab-to-money-manager-${GITHUB_REF_NAME}.zip"
          --verify-tag
          --generate-notes
          --title "YNAB to Money Manager ${GITHUB_REF_NAME}"

